name: Keep Render service awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS --max-time 60 https://aureus-capital-markets.onrender.com/ping || true
          curl -fsS --max-time 60 https://aureus-capital-markets.onrender.com/health || true